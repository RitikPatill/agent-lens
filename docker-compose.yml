version: "3.9"

# Both services are stubs — implemented in M3 (collector) and M4 (dashboard).
# Run with: docker compose --profile full up

services:
  collector:
    profiles: ["full"]
    build:
      context: server/
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite:///./agentlens.db

  dashboard:
    profiles: ["full"]
    build:
      context: dashboard/
    ports:
      - "5173:5173"
    depends_on:
      - collector
